<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfólio Acadêmico</title>
    <!-- Vinculando o mesmo arquivo CSS para manter a identidade visual -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para centralizar a caixa de login na tela */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }
        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }
        .login-container h1 {
            color: #1c2d42;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .login-container p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #1c2d42;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1c2d42;
        }
        .btn-acessar {
            width: 100%;
            background-color: #1c2d42;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-acessar:hover {
            background-color: #2b435f;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Portfólio Acadêmico</h1>
        <p>Acesse o seu painel de evolução</p>
        
        <!-- Formulário de Autenticação -->
        <form id="form-login" onsubmit="realizarLogin(event)">
            <div class="form-group">
                <label for="usuario-ra">R.A. do Aluno:</label>
                <input type="text" id="usuario-ra" placeholder="Ex: 1127204804" required>
            </div>
            
            <div class="form-group">
                <label for="usuario-senha">Senha de Acesso:</label>
                <input type="password" id="usuario-senha" placeholder="Digite sua senha" required>
            </div>
            
            <button type="submit" class="btn-acessar">Entrar no Sistema</button>
        </form>
    </div>

    <script>
        // Função simples para simular o login e redirecionar
        function realizarLogin(event) {
            event.preventDefault(); // Impede a página de atualizar antes do redirecionamento
            
            const raInput = document.getElementById("usuario-ra").value;
            
            // Simulação de validação (você pode colocar qualquer lógica aqui no futuro)
            if (raInput.trim() !== "") {
                // Redireciona o navegador diretamente para a tela das matérias
                window.location.href = "materia.html";
            } else {
                alert("Por favor, preencha os campos corretamente.");
            }
        }
    </script>

</body>
</html>
